name: Pipeline Somativa 2

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # --- AQUI COMEÇA A PARTE QUE VOCÊ ESTAVA EM DÚVIDA ---
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Pytest
        run: pip install pytest

      - name: Executar Testes Unitários
        run: pytest test_main.py
      # --- AQUI TERMINA A PARTE DOS TESTES ---

      - name: Construir Imagem Docker
        run: docker build -t minha-app-docker .

      - name: Notificar Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Resultado do Pipeline - Testes Unitários"
