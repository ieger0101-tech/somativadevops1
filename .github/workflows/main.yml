name: CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Construir Imagem Docker
        run: docker build -t minha-app-docker:latest .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Simulando deploy
        run: echo "Deploy da imagem Docker realizado com sucesso 🚀"
